# Base stack definition — the portable service topology.
#
# This file alone is NOT enough to run the platform: bind mounts, published
# ports and app-specific tuning live in <app>/compose.override.yml and are
# merged in through COMPOSE_FILE (set in .env, see .env.example).
#
#   docker compose config     # render the fully merged result
#   docker compose up -d      # start everything
#
# Image tags are variables so a version can be pinned in .env without
# touching this file. Defaults are floating tags — pin them in production.

name: platform

services:

  # --- edge -----------------------------------------------------------
  # Host :80 and :443 are owned by `edge`, an L4 router, and split between
  # two independent TLS worlds:
  #
  #   :443  routed by SNI, never decrypted here
  #           platform hostnames  -> proxy      (certs from acme-companion)
  #           anything else       -> Kubernetes (certs from cert-manager)
  #   :80   all of it -> proxy, which forwards the cluster's share on by
  #         Host header (proxy/conf.d/00-cluster.conf)
  #
  # The platform terminates its own TLS and does NOT depend on the cluster:
  # fronting zot with the cluster's ingress would be circular — the cluster
  # needs images, the images live in zot, zot would only be reachable
  # through the cluster. The edge is L4 precisely so it stays out of that
  # loop: it needs no certificate, no config from either side, and it keeps
  # serving the platform while the cluster is down.
  #
  # Install k3s with `--disable=traefik --disable=servicelb` and give the
  # cluster ingress NodePorts 30080/30443, or it will fight for 80/443.

  edge:

    image: nginx:${NGINX_VERSION:-alpine}
    container_name: platform-edge
    restart: unless-stopped

    depends_on:
      # Every connection is forwarded to one of the two backends; starting
      # before the proxy exists only produces a minute of 502s.
      proxy:
        condition: service_healthy

    environment:
      # Substituted into edge/sni.stream-template at startup. Each platform
      # hostname needs its own line in that file's map — everything not
      # listed there is routed to Kubernetes.
      REGISTRY_HOST: ${REGISTRY_HOST:?set REGISTRY_HOST in .env}
      SECRETS_HOST: ${SECRETS_HOST:?set SECRETS_HOST in .env}
      # Where the cluster ingress' NodePorts are reachable *from inside this
      # container*. Not 127.0.0.1: k3s runs in the host's network namespace,
      # this does not. `make cluster-check` finds a working value.
      CLUSTER_INGRESS_IP: ${CLUSTER_INGRESS_IP:-127.0.0.1}

    networks:
      - platform

    healthcheck:
      # The stream servers cannot answer an HTTP probe; edge/health.conf
      # provides a loopback-only endpoint that can.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:81/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s


  proxy:

    image: nginxproxy/nginx-proxy:${NGINX_PROXY_VERSION:-1.11-alpine}
    container_name: platform-proxy
    restart: unless-stopped

    labels:
      # How acme-companion finds this container. Prefer the label over the
      # NGINX_PROXY_CONTAINER env var: the env var is trusted blindly, so if
      # the proxy is not running acme fails with the misleading
      # "can't get docker-gen container id" instead of naming the real
      # problem. The label is resolved by querying running containers.
      com.github.nginx-proxy.nginx: "true"

    environment:
      ENABLE_IPV6: "true"
      # Traffic arrives from the edge container, so the client address is
      # only knowable from the PROXY protocol header it prepends. This puts
      # `proxy_protocol` on the :80 and :443 listeners — both of them, which
      # is why the edge has to speak it on both ports too, and why the
      # healthcheck below uses a separate plaintext port.
      ENABLE_PROXY_PROTOCOL: "true"

    extra_hosts:
      # The cluster ingress, for proxy/conf.d/00-cluster.conf. This image
      # has no envsubst, so the address is injected as an /etc/hosts entry
      # rather than interpolated into the config file.
      - "cluster-ingress:${CLUSTER_INGRESS_IP:-127.0.0.1}"

    networks:
      - platform

    healthcheck:
      # Not port 80: with ENABLE_PROXY_PROTOCOL nginx expects a PROXY header
      # there and curl cannot send one. proxy/conf.d/10-health.conf answers
      # on loopback:81 instead.
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:81/healthz > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  acme:

    # Watches for containers with LETSENCRYPT_HOST and issues/renews their
    # certificates into the shared certs volume.
    image: nginxproxy/acme-companion:${ACME_COMPANION_VERSION:-2.8}
    container_name: platform-acme
    restart: unless-stopped

    depends_on:
      # Not just "started": acme inspects the proxy container at boot and
      # exits if it cannot find it.
      proxy:
        condition: service_healthy

    environment:
      DEFAULT_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      # Point at the staging directory while testing — see .env.example.
      ACME_CA_URI: ${ACME_CA_URI:-https://acme-v02.api.letsencrypt.org/directory}

    networks:
      - platform


  postgres:

    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: platform-postgres
    restart: unless-stopped
    stop_grace_period: 1m

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      # Consumed by postgres/init/01-init-databases.sh — on first boot, and
      # whenever the script is re-run by hand via `docker compose exec`, which
      # sees only what is listed here.
      INFISICAL_DB_PASSWORD: ${INFISICAL_DB_PASSWORD:?set INFISICAL_DB_PASSWORD in .env}
      KOVOSPACE_DB_PASSWORD: ${KOVOSPACE_DB_PASSWORD:?set KOVOSPACE_DB_PASSWORD in .env}
      PASTER_DB_PASSWORD: ${PASTER_DB_PASSWORD:?set PASTER_DB_PASSWORD in .env}
      SCRAPER_DB_PASSWORD: ${SCRAPER_DB_PASSWORD:?set SCRAPER_DB_PASSWORD in .env}
      NEW_TAB_LINKS_DB_PASSWORD: ${NEW_TAB_LINKS_DB_PASSWORD:?set NEW_TAB_LINKS_DB_PASSWORD in .env}
    networks:
      - platform

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  redis:

    # Required by Infisical for its job queues and caching — not optional.
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: platform-redis
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --appendonly
      - "yes"

    environment:
      # Only so the healthcheck can authenticate; redis itself ignores it.
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    networks:
      - platform

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5


  zot:

    # The full (non-minimal) image — it is the one that ships the web UI,
    # search and metrics extensions. zot-minimal-* has no UI.
    image: ghcr.io/project-zot/zot-linux-amd64:${ZOT_VERSION:-v2.1.21}
    container_name: platform-zot
    restart: unless-stopped

    # No healthcheck: the image is distroless, it has neither a shell nor
    # curl, so there is nothing to probe /v2/ with from the inside.

    networks:
      - platform


  infisical:

    image: infisical/infisical:${INFISICAL_VERSION:-latest}
    container_name: platform-infisical
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      NODE_ENV: production
      # Schema migrations run automatically on container start.
      DB_CONNECTION_URI: postgresql://infisical:${INFISICAL_DB_PASSWORD}@postgres:5432/infisical
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?set INFISICAL_ENCRYPTION_KEY in .env}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?set INFISICAL_AUTH_SECRET in .env}
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8080}

    networks:
      - platform


networks:

  platform:
    name: platform-network