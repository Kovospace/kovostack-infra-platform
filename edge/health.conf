# Mounted over the stock /etc/nginx/conf.d/default.conf, which would bind
# :80 in the http context and collide with the stream server that owns that
# port — nginx would fail to start with "Address already in use".
#
# What is left is a loopback-only endpoint for the container healthcheck:
# the stream servers cannot answer one, and there is nothing else in the
# http context worth keeping.

server {
    listen 127.0.0.1:81;
    server_name _;
    access_log off;

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}
