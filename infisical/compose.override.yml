# Infisical — host wiring. Paths are relative to the repo root.
#
# Stateless: all state is in Postgres (database "infisical") and Redis, so
# there is nothing to bind-mount here.

services:

  infisical:

    ports:
      - "127.0.0.1:${INFISICAL_PORT:-8080}:8080"

    environment:
      # Discovered by nginx-proxy and acme-companion over the docker socket.
      VIRTUAL_HOST: ${SECRETS_HOST:?set SECRETS_HOST in .env}
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: ${SECRETS_HOST}

      # Optional. Without SMTP you can still create the first admin account,
      # but invites, password resets and alerts will not be delivered.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Kovostack Platform}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"