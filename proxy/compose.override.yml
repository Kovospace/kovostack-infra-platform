# nginx-proxy + acme-companion — host wiring.
# Paths are relative to the repo root.
#
# Certificates and ACME account state live in named volumes, not in the repo:
# they are generated, renewable, and must never be committed.

services:

  proxy:

    # No published ports. Host 80/443 belong to the edge container, which
    # forwards here over platform-network; publishing them again would
    # bypass the SNI router and break the PROXY protocol handshake.

    volumes:
      - proxy-certs:/etc/nginx/certs:ro
      - proxy-vhost:/etc/nginx/vhost.d
      - proxy-html:/usr/share/nginx/html
      # Read-only: nginx-proxy only watches container events.
      - ${DOCKER_HOST_PATH:-/var/run/docker.sock}:/tmp/docker.sock:ro

      # Applies to every vhost that has no file of its own.
      - ./proxy/vhost.d/default:/etc/nginx/vhost.d/default:ro
      # Per-vhost overrides are looked up by hostname, so the mount target
      # is interpolated from .env.
      - ./proxy/vhost.d/registry:/etc/nginx/vhost.d/${REGISTRY_HOST:?set REGISTRY_HOST in .env}:ro

      # Hand-written server blocks, for what docker-gen cannot generate:
      # a backend that is not a container (the cluster ingress) and a
      # healthcheck endpoint that does not expect a PROXY header. nginx
      # includes conf.d/*.conf, so each file is mounted individually — and
      # the numeric prefixes are load-bearing, see 00-cluster.conf.
      - ./proxy/conf.d/00-cluster.conf:/etc/nginx/conf.d/00-cluster.conf:ro
      - ./proxy/conf.d/10-health.conf:/etc/nginx/conf.d/10-health.conf:ro

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"


  acme:

    volumes:
      - proxy-certs:/etc/nginx/certs
      - proxy-vhost:/etc/nginx/vhost.d
      - proxy-html:/usr/share/nginx/html
      - proxy-acme:/etc/acme.sh
      - ${DOCKER_HOST_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


volumes:

  proxy-certs:
  proxy-vhost:
  proxy-html:
  proxy-acme: