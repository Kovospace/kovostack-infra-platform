# Port 80 for everything that is not a platform vhost — i.e. Kubernetes.
#
# The name of this file is load-bearing. nginx makes the FIRST server block
# for a port the default server unless one is explicitly marked with
# `default_server`, nginx-proxy deliberately never marks one (it leaves even
# its own 503 fallback unmarked), and conf.d/*.conf is included in
# alphabetical order. The 00- prefix is what puts this block ahead of the
# generated default.conf. Rename the file and unknown hosts fall back to
# nginx-proxy's 503 instead of reaching the cluster.
#
# No server_name is needed for the same reason: matching happens by
# elimination. zot and Infisical have exact-match vhosts generated from
# their VIRTUAL_HOST, and an exact match always beats the default server.
#
# Only :80 is here, never :443. Cluster TLS does not reach nginx-proxy at
# all — the edge passes those connections through by SNI, encrypted, so
# cert-manager can answer them. What still has to arrive on :80 is
# cert-manager's HTTP-01 challenge and the ingress' own http->https
# redirect.
#
# cluster-ingress is not DNS: it is an /etc/hosts entry injected by compose
# from CLUSTER_INGRESS_IP, because this image (unlike the edge's) has no
# envsubst. nginx resolves it once at startup, which is fine for a static
# host address — but it does mean changing CLUSTER_INGRESS_IP requires
# `docker compose up -d --force-recreate proxy`, not just a reload.

# Own map rather than nginx-proxy's $proxy_connection: that one is derived
# from a per-upstream $upstream_keepalive that only its generated locations
# set, so reusing it here would resolve to the wrong thing.
map $http_upgrade $cluster_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # proxy_protocol because the edge speaks it and ENABLE_PROXY_PROTOCOL
    # puts it on nginx-proxy's own listeners; all server blocks sharing a
    # listen socket must agree, or nginx refuses to start.
    listen 80 proxy_protocol;
    listen [::]:80 proxy_protocol;

    server_name _;
    server_tokens off;

    # Large enough for anything that has a reason to be on plain http.
    client_max_body_size 16m;

    location / {
        proxy_pass http://cluster-ingress:30080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # $remote_addr is the edge container, not the client — with
        # proxy_protocol the real address arrives in $proxy_protocol_addr.
        proxy_set_header X-Real-IP $proxy_protocol_addr;
        proxy_set_header X-Forwarded-For $proxy_protocol_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;

        # Websockets and SPDY upgrades on plain http, for completeness.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $cluster_connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
