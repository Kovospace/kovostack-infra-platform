# A plaintext port for the container healthcheck.
#
# ENABLE_PROXY_PROTOCOL makes :80 and :443 expect a PROXY header before the
# request, which curl cannot send — the old `curl http://localhost/` check
# would fail permanently and, because acme waits on the proxy being healthy,
# take the certificate renewals down with it.
#
# 127.0.0.1 only: nothing outside the container can reach this.

server {
    listen 127.0.0.1:81;
    server_name _;
    access_log off;

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 444;
    }
}
