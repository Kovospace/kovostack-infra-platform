# zot registry — host wiring. Paths are relative to the repo root.

services:

  zot:

    volumes:
      # Whole config dir, because htpasswd (generated on the server, never
      # committed) has to sit next to config.json.
      - ./zot/config:/etc/zot:ro
      - ./zot/data:/var/lib/registry

    environment:
      # Discovered by nginx-proxy and acme-companion over the docker socket;
      # zot itself ignores these.
      VIRTUAL_HOST: ${REGISTRY_HOST:?set REGISTRY_HOST in .env}
      VIRTUAL_PORT: "5000"
      LETSENCRYPT_HOST: ${REGISTRY_HOST}

    ports:
      # Loopback only, for admin access and SSH tunnels. Public traffic
      # arrives through the proxy on 443 instead.
      - "127.0.0.1:${ZOT_PORT:-5000}:5000"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"